[package]
name = "octocode"
autobins = false
version = "0.1.0"
edition = "2021"
description = "Multi-model, multi-agent coding CLI with TUI"
default-run = "octo"

[dependencies]
anyhow = "1"
base64 = "0.22"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
flate2 = "1"
futures = "0.3"
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "process", "signal", "io-std", "io-util"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
tokio-stream = "0.1"
walkdir = "2"
zip = "2"
ignore = "0.4"
glob = "0.3"
fs2 = "0.4"
keyring = "3"
similar = "2"
unicode-normalization = "0.1"
unicode-width = "0.2"
libc = "0.2"
regex = "1"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
pdf-extract = "0.7"

[dev-dependencies]
wiremock = "0.6"
insta = "1"
tempfile = "3"

[lib]
name = "deepseek_code"
path = "src/lib.rs"

[[bin]]
name = "octocode"
path = "src/main.rs"

[[bin]]
name = "octo"
path = "src/bin/octo.rs"

[profile.release]
opt-level = 3
codegen-units = 1
lto = true
strip = true
