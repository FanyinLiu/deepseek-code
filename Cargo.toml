[package]
name = "deepseek-code"
version = "0.1.0"
edition = "2021"
description = "DeepSeek-native coding agent with TUI"
default-run = "deepseek-code"

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3"
ratatui = "0.30"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "process", "signal"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
tokio-stream = "0.1"
walkdir = "2"
ignore = "0.4"
glob = "0.3"
fs2 = "0.4"
keyring = "3"
similar = "2"
unicode-normalization = "0.1"
unicode-width = "0.2"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }

[dev-dependencies]
wiremock = "0.6"
insta = "1"
tempfile = "3"

[[bin]]
name = "deepseek-code"
path = "src/main.rs"

[[bin]]
name = "dscode"
path = "src/bin/dscode.rs"

[[bin]]
name = "ds"
path = "src/bin/ds.rs"

[profile.release]
opt-level = 3
lto = true
strip = true
