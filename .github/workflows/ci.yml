name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all --check
      - run: cargo check --all-targets --all-features
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - run: node --test scripts/npm-bootstrap.test.js
      - run: cargo run --bin octocode -- --help
      - run: cargo run --bin octo -- --help
      - run: cargo run --bin octo -- onboard --json
        env:
          DEEPSEEK_API_KEY: ci-placeholder
          OCTOCODE_HOME: ${{ runner.temp }}/octocode-home
      - run: cargo run --bin octocode -- preview-tui --api ready --scenario welcome --width 80 --height 24

  windows-parity:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Windows binaries
        run: cargo build --bins --all-features
      - name: Verify Windows CLI and TUI parity contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $Octo = Join-Path $env:GITHUB_WORKSPACE "target\debug\octo.exe"
          $Octocode = Join-Path $env:GITHUB_WORKSPACE "target\debug\octocode.exe"
          foreach ($Binary in @($Octo, $Octocode)) {
            if (-not (Test-Path $Binary)) {
              throw "missing Windows binary: $Binary"
            }

            & $Binary --version
            if ($LASTEXITCODE -ne 0) {
              throw "version smoke failed: $Binary"
            }
          }

          $commandsText = & $Octo -C $env:GITHUB_WORKSPACE commands list --json
          if ($LASTEXITCODE -ne 0) {
            throw "commands list failed"
          }

          $commands = ($commandsText -join "`n") | ConvertFrom-Json
          foreach ($Field in @("builtins", "custom", "skills", "mcp_prompts", "conflicts", "locations")) {
            if (-not ($commands.PSObject.Properties.Name -contains $Field)) {
              throw "commands list missing field: $Field"
            }
          }
          if (-not ($commands.builtins | Where-Object { $_.name -eq "/help" })) {
            throw "commands list missing /help"
          }

          $mcpText = & $Octo -C $env:GITHUB_WORKSPACE commands list --json --filter mcp
          if ($LASTEXITCODE -ne 0) {
            throw "commands list --filter mcp failed"
          }

          $mcpCommands = ($mcpText -join "`n") | ConvertFrom-Json
          if (-not ($mcpCommands.builtins | Where-Object { $_.name -eq "/mcp" })) {
            throw "commands list --filter mcp missing /mcp"
          }

          $rootless = Join-Path $env:RUNNER_TEMP "octocode-rootless"
          New-Item -ItemType Directory -Force $rootless | Out-Null
          $errPath = Join-Path $env:RUNNER_TEMP "octocode-rootless.err"
          Push-Location $rootless
          try {
            $jsonLines = & $Octo chat hello --output-format json 2>$errPath
            $jsonExit = $LASTEXITCODE
          } finally {
            Pop-Location
          }

          if ($jsonExit -eq 0) {
            throw "chat --output-format json should fail outside a project root"
          }

          $chat = ($jsonLines -join "`n") | ConvertFrom-Json
          foreach ($Field in @("status", "session_id", "final_message", "tool_calls", "usage", "error")) {
            if (-not ($chat.PSObject.Properties.Name -contains $Field)) {
              throw "chat json missing field: $Field"
            }
          }
          if ($chat.status -ne "error") {
            throw "chat json status should be error"
          }
          if ($null -ne $chat.session_id) {
            throw "chat json session_id should be null on preflight failure"
          }
          if ($chat.error -notmatch "project root") {
            throw "chat json error should explain the project root requirement"
          }

          $previewDir = Join-Path $env:RUNNER_TEMP "octocode-preview"
          New-Item -ItemType Directory -Force $previewDir | Out-Null
          $welcomePath = Join-Path $previewDir "welcome.txt"
          $workbenchPath = Join-Path $previewDir "workbench.txt"

          $welcome = & $Octo preview-tui --api ready --scenario welcome --width 100 --height 28 --theme high-contrast
          if ($LASTEXITCODE -ne 0) {
            throw "welcome preview-tui failed"
          }
          $welcome | Set-Content -Encoding utf8 $welcomePath
          $welcomeText = $welcome -join "`n"
          foreach ($Marker in @("OCTOCODE", "octo", "deepseek-v4-flash")) {
            if ($welcomeText -notmatch [regex]::Escape($Marker)) {
              throw "welcome preview missing marker: $Marker"
            }
          }

          $workbench = & $Octo preview-tui --api ready --scenario workbench --width 100 --height 28 --theme high-contrast
          if ($LASTEXITCODE -ne 0) {
            throw "workbench preview-tui failed"
          }
          $workbench | Set-Content -Encoding utf8 $workbenchPath
          $workbenchText = $workbench -join "`n"
          foreach ($Marker in @("Thinking", "Agents", "ds/flash")) {
            if ($workbenchText -notmatch [regex]::Escape($Marker)) {
              throw "workbench preview missing marker: $Marker"
            }
          }
      - name: Upload Windows preview snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-octocode-preview-tui
          path: ${{ runner.temp }}\octocode-preview\*.txt
          if-no-files-found: ignore

  release:
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, windows-parity]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Build release package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force dist | Out-Null

          $Tag = "${{ github.ref_name }}"
          $Target = "${{ matrix.target }}"
          $IsWin = "${{ runner.os }}" -eq "Windows"
          $BinExt = if ($IsWin) { ".exe" } else { "" }
          $Package = if ($IsWin) {
            "octo-$Tag-$Target.zip"
          } else {
            "octo-$Tag-$Target.tar.gz"
          }

          $Octocode = "target/$Target/release/octocode$BinExt"
          $Octo = "target/$Target/release/octo$BinExt"
          if (-not (Test-Path $Octocode)) {
            throw "missing binary: $Octocode"
          }
          if (-not (Test-Path $Octo)) {
            throw "missing binary: $Octo"
          }

          $workDir = "dist/stage-$Target"
          New-Item -ItemType Directory -Force $workDir | Out-Null
          Copy-Item -Path $Octocode -Destination (Join-Path $workDir "octocode$BinExt") -Force
          Copy-Item -Path $Octo -Destination (Join-Path $workDir "octo$BinExt") -Force
          Copy-Item -Path "README.md" -Destination (Join-Path $workDir "README.md") -Force

          if ($IsWin) {
            Compress-Archive -Path (Join-Path $workDir "*") -DestinationPath "dist/$Package" -Force
          } else {
            tar -C $workDir -czf dist/$Package octocode$BinExt octo$BinExt README.md
          }
          "PACKAGE_NAME=$Package" | Out-File -FilePath $Env:GITHUB_ENV -Append
          "TARGET_NAME=$Target" | Out-File -FilePath $Env:GITHUB_ENV -Append
      - name: Compute checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:PACKAGE_NAME) {
            throw "missing package name from package step."
          }

          $package = Join-Path dist $env:PACKAGE_NAME
          if (-not (Test-Path $package)) {
            throw "missing package: $package"
          }
          $out = Join-Path dist "$env:PACKAGE_NAME.sha256"
          if (Test-Path $out) { Remove-Item $out }
          $hash = (Get-FileHash $package -Algorithm SHA256).Hash.ToLowerInvariant()
          "{0}  {1}" -f $hash, (Split-Path $package -Leaf) | Add-Content -Path $out -Encoding UTF8
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
